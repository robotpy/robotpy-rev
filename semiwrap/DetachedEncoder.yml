extra_includes:
- rev/DetachedEncoderLowLevel.h
- rev/RelativeEncoder.h

classes:
  rev::detached::DetachedEncoder:
    typealias:
    - rev::detached::DetachedEncoderLowLevel::EncoderModel
    base_qualnames:
      RelativeEncoder: rev::RelativeEncoder
    attributes:
      configAccessor:
    methods:
      GetPosition:
      GetVelocity:
      GetAngle:
      GetRawAngle:
      SetPosition:
      Configure:
      GetFaults:
      GetStickyFaults:
      ClearFaults:
      DetachedEncoder:
  rev::detached::DetachedEncoder::Faults:
    inline_code: |
      .def("__repr__", [](const rev::detached::DetachedEncoder::Faults &self) {
        return py::str("DetachedEncoder.Faults(unexpected={!r}, has_reset={!r}, "
                       "can_tx={!r}, can_rx={!r}, eeprom={!r}, raw_bits={!r})")
          .format(self.unexpected, self.hasReset, self.canTx, self.canRx,
                  self.eeprom, self.rawBits);
      });
    attributes:
      unexpected:
      hasReset:
      canTx:
      canRx:
      eeprom:
      rawBits:
