typealias:
- rev::REVLibError

classes:
  rev::servohub::ServoHub:
    attributes:
      configAccessor:
    enums:
      ResetMode:
      Bank:
    methods:
      ServoHub:
      Configure:
        overloads:
          ServoHubConfig&, ResetMode:
          ServoHubConfig&, rev::ResetMode:
      ConfigureAsync:
        overloads:
          ServoHubConfig&, ResetMode:
          ServoHubConfig&, rev::ResetMode:
      HasActiveFault:
      HasStickyFault:
      HasActiveWarning:
      HasStickyWarning:
      GetFaults:
      GetStickyFaults:
      GetWarnings:
      GetStickyWarnings:
      ClearFaults:
      GetDeviceVoltage:
      GetDeviceCurrent:
      GetServoVoltage:
      GetServoChannel:
      SetBankPulsePeriod:
  rev::servohub::ServoHub::Faults:
    inline_code: |
      .def("__repr__", [](const rev::servohub::ServoHub::Faults &self) {
        return py::str("ServoHub.Faults(regulator_power_good={!r}, hardware={!r}, "
                       "firmware={!r}, low_battery={!r}, raw_bits={!r})")
          .format(self.regulatorPowerGood, self.hardware, self.firmware,
                  self.lowBattery, self.rawBits);
      });
    attributes:
      regulatorPowerGood:
      hardware:
      firmware:
      lowBattery:
      rawBits:
    methods:
      Faults:
        overloads:
          "":
          uint16_t:
  rev::servohub::ServoHub::Warnings:
    inline_code: |
      .def("__repr__", [](const rev::servohub::ServoHub::Warnings &self) {
        return py::str("ServoHub.Warnings(brownout={!r}, can_warning={!r}, can_bus_off={!r}, "
                       "has_reset={!r}, channel0_overcurrent={!r}, channel1_overcurrent={!r}, "
                       "channel2_overcurrent={!r}, channel3_overcurrent={!r}, "
                       "channel4_overcurrent={!r}, channel5_overcurrent={!r}, raw_bits={!r})")
          .format(self.brownout, self.canWarning, self.canBusOff, self.hasReset,
                  self.channel0Overcurrent, self.channel1Overcurrent, self.channel2Overcurrent,
                  self.channel3Overcurrent, self.channel4Overcurrent, self.channel5Overcurrent,
                  self.rawBits);
      });
    attributes:
      brownout:
      canWarning:
      canBusOff:
      hasReset:
      channel0Overcurrent:
      channel1Overcurrent:
      channel2Overcurrent:
      channel3Overcurrent:
      channel4Overcurrent:
      channel5Overcurrent:
      rawBits:
    methods:
      Warnings:
        overloads:
          "":
          uint16_t:
