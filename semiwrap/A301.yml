  first::a301::A301::FirmwareVersion:
    inline_code: |
      .def("__repr__", [](const first::a301::A301::FirmwareVersion &self) {
        return py::str("A301.FirmwareVersion(major={!r}, minor={!r}, patch={!r}, prerelease={!r})")
          .format(self.major, self.minor, self.patch, self.prerelease);
      });
    attributes:
      major:
      minor:
      patch:
      prerelease:
  first::a301::A301::Faults:
    inline_code: |
      .def("__repr__", [](const first::a301::A301::Faults &self) {
        return py::str("A301.Faults(other={!r}, sensor={!r}, can={!r}, temperature={!r}, "
                       "gate_driver={!r}, esc_eeprom={!r}, firmware={!r}, "
                       "motor_startup={!r}, raw_bits={!r})")
          .format(self.other, self.sensor, self.can, self.temperature, self.gateDriver,
                  self.escEeprom, self.firmware, self.motorStartup, self.rawBits);
      });
    attributes:
      other:
      sensor:
      can:
      temperature:
      gateDriver:
      escEeprom:
      firmware:
      motorStartup:
      rawBits:
    methods:
